<!DOCTYPE html>
<html lang="en"><head><title>Log in | Archive of Our Own</title></head>
<body>
<header id="header" class="region">
  <div id="login" class="dropdown"><p class="user actions"><a id="login-dropdown" href="/users/login">Log In</a></p></div>
</header>
<div id="main" class="sessions-new region">
  <div class="flash error">The password or user name you entered doesn't match our records. Please try again.</div>
  <form id="new_user" class="new_user" action="/users/login" accept-charset="UTF-8" method="post">
    <input type="hidden" name="authenticity_token" value="tok123" autocomplete="off" />
    <dl>
      <dt><label for="user_login">User name or email:</label></dt>
      <dd><input id="user_login" type="text" name="user[login]" /></dd>
      <dt><label for="user_password">Password:</label></dt>
      <dd><input id="user_password" type="password" name="user[password]" /></dd>
      <dd class="user_remember_me_wrapper"><input name="user[remember_me]" type="hidden" value="0" /><input type="checkbox" value="1" name="user[remember_me]" id="user_remember_me" /></dd>
    </dl>
    <p class="submit actions"><input type="submit" name="commit" value="Log in" /></p>
  </form>
</div>
</body></html>
